# Local dev uses '/'; production baseURL set via --baseURL in GitHub Actions
# Production URLs: https://minnehaha.org/
baseURL = '/'
languageCode = 'en-us'
title = 'Minnehaha United Methodist Church'
enableRobotsTXT = true

# For GitHub Pages
[caches]
  [caches.images]
    dir = ':cacheDir/images'

# Disable taxonomies (not used for this site)
disableKinds = ['taxonomy', 'term']

# Allow raw HTML in markdown files
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  description = "Minnehaha United Methodist Church - Your neighborhood church in Minneapolis"
  address = "3701 East 50th Street, Minneapolis, MN 55417"
  phone = "612.721.6231"
  email = "office@minnehaha.org"
  facebook = "https://www.facebook.com/MinnehahaUMC"
  instagram = "https://www.instagram.com/minnehahaumc"
  youtube = "https://www.youtube.com/@minnehahaumc"

